name: Improvement or feature
description: Suggest a change. Describe the problem first, then your idea.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected, and what is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: KPI and cost impact
      description: Which KPI does it move, and what does it add to or save on the AWS and Salesforce bill?
  - type: textarea
    id: scale-security
    attributes:
      label: Scale and security
      description: Does it still work for a whole fleet? Does it need new permissions or data?
  - type: checkboxes
    id: pr
    attributes:
      label: Contribution
      options:
        - label: I would like to send a pull request for this.
