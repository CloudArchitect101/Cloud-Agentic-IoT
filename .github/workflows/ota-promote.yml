name: OTA promote (Prod canary to fleet)

# Manual only, and deliberately so. Promotion is the judgement that the canary
# ring ran a build long enough to trust it on every board. That judgement is a
# person's; automating it removes the only checkpoint between a bad build and
# the whole fleet.
#
# Prod only: in Dev, every release already goes to every Dev board.
# scripts/ota.sh refuses unless that version's canary job finished with at
# least one board updated and none failed, refused or timed out.
on:
  workflow_dispatch:
    inputs:
      sketch:
        description: Device type
        type: choice
        options: [patient-monitor, queue-indicator]
      version:
        description: Version the canary ran, e.g. 2.0.1
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  promote:
    # Run it from the Prod branch, so the script doing the promoting is the
    # reviewed one.
    if: github.ref_name == 'Prod'
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Inputs reach the shell through env, never pasted into the script.
      - name: Promote
        env:
          SKETCH: ${{ inputs.sketch }}
          VERSION: ${{ inputs.version }}
        run: scripts/ota.sh promote Prod "$SKETCH" "$VERSION"
