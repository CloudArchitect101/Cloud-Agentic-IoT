name: Deploy Salesforce Metadata

on:
  push:
    branches: [Dev, Prod]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      # Prod sits at a clean baseline until a promotion brings feature work in,
      # and several branches carry no Salesforce metadata at all. sfdx-project.json
      # is present everywhere as project config, so the real signal is whether
      # force-app actually holds anything.
      - name: Check whether there is any Salesforce metadata to deploy
        id: check
        run: |
          if [ -d force-app ] && [ -n "$(find force-app -type f 2>/dev/null)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Salesforce metadata in force-app/ on ${{ github.ref_name }} — nothing to deploy."
          fi

      # Node 22, not 20. The CLI pulls in jsforce, which depends on undici 8,
      # which declares "node": ">=22.19.0". npm only warns about an unmet
      # engines field, so the install succeeds and the CLI then dies on its
      # first run with "webidl.util.markAsUncloneable is not a function" —
      # an API that does not exist on Node 20. Do not lower this.
      - uses: actions/setup-node@v4
        if: steps.check.outputs.found == 'true'
        with:
          node-version: '22'

      - name: Install Salesforce CLI
        if: steps.check.outputs.found == 'true'
        run: npm install --global @salesforce/cli

      # Secrets go through env, not ${{ }} interpolation into the script body:
      # interpolation pastes the value into the shell source before bash sees
      # it, so a value containing a quote would break out of the command.
      - name: Authenticate via JWT Bearer Flow (no password, ever)
        if: steps.check.outputs.found == 'true'
        env:
          SF_JWT_KEY:      ${{ secrets.SF_JWT_KEY }}
          SF_CONSUMER_KEY: ${{ secrets.SF_CONSUMER_KEY }}
          SF_USERNAME:     ${{ secrets.SF_USERNAME }}
          # An unset variable interpolates to an empty string, and `sf` treats
          # --instance-url "" as "log in to nothing". Default it here so a
          # missing environment variable cannot silently produce that.
          SF_LOGIN_URL:    ${{ vars.SF_LOGIN_URL || 'https://login.salesforce.com' }}
        run: |
          set -euo pipefail

          # Fail with a readable message rather than an opaque CLI error.
          missing=""
          for name in SF_JWT_KEY SF_CONSUMER_KEY SF_USERNAME; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Environment secret(s):$missing"
            echo "Set them for the '${{ github.ref_name }}' environment — see docs/SETUP.md"
            exit 1
          fi

          printf '%s' "$SF_JWT_KEY" | base64 --decode > server.key
          chmod 600 server.key
          grep -q "PRIVATE KEY" server.key || {
            echo "::error::SF_JWT_KEY did not decode to a PEM private key. Store it as: base64 -i server-deploy.key"
            exit 1
          }

          sf org login jwt \
            --client-id "$SF_CONSUMER_KEY" \
            --jwt-key-file server.key \
            --username "$SF_USERNAME" \
            --instance-url "$SF_LOGIN_URL" \
            --alias target-org \
            --set-default
          rm -f server.key

      # Dry run first: on Prod a bad deploy should fail before it touches the org.
      - name: Validate deployment (check-only, runs local tests)
        if: steps.check.outputs.found == 'true'
        run: |
          sf project deploy start \
            --dry-run \
            --test-level RunLocalTests \
            --target-org target-org \
            --wait 30

      - name: Deploy
        if: steps.check.outputs.found == 'true'
        run: |
          sf project deploy start \
            --test-level RunLocalTests \
            --target-org target-org \
            --wait 30

      - name: Always clean up the key material
        if: always()
        run: rm -f server.key
