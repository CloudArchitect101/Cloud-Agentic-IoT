name: Test Lambda functions

# Runs on every pull request and every push to main. Unlike the deploy
# workflows it needs no secrets and touches no AWS account or org: every AWS
# and Salesforce call is replaced by a fake, so it is safe to run on any branch.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 22 for the test runner's glob support. The functions themselves run on
      # nodejs20.x and use nothing newer.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Catches a syntax error in a function that has no tests yet.
      - name: Syntax-check every Lambda source file
        run: find lambda -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Run tests
        run: npm test
