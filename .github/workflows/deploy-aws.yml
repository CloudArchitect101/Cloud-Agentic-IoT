name: Deploy AWS Infrastructure

on:
  push:
    branches: [Dev, Prod]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS credentials (OIDC, no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # GitHub is the single source of truth for these values; SSM is only the
      # delivery mechanism the templates read from. Seeding here rather than
      # by hand means Prod is reproducible and nothing has to be kept in sync
      # in two places.
      #
      # They are String, not SecureString, on purpose: CloudFormation's
      # AWS::SSM::Parameter::Value<String> cannot resolve a SecureString, and
      # the templates use that type. The values end up in Lambda environment
      # variables either way, so SecureString would buy encryption at rest in
      # SSM only. Anyone with lambda:GetFunctionConfiguration can still read
      # them - that is the trade-off of env-var delivery, and moving the
      # Lambdas to read from SSM at runtime is what would actually fix it.
      - name: Seed SSM Parameter Store from GitHub Environment secrets
        env:
          SF_CONSUMER_KEY: ${{ secrets.SF_CONSUMER_KEY }}
          SF_USERNAME:     ${{ secrets.SF_USERNAME }}
          SF_JWT_KEY:      ${{ secrets.SF_JWT_KEY }}
          SF_LOGIN_URL:    ${{ vars.SF_LOGIN_URL || 'https://login.salesforce.com' }}
          SF_INSTANCE:     ${{ vars.SF_INSTANCE }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
        run: |
          set -euo pipefail

          put() {   # put <name> <value>; skips silently when the value is empty
            [ -n "${2:-}" ] || { echo "::warning::$1 not set, skipping"; return 0; }
            aws ssm put-parameter --name "$1" --type String --overwrite \
              --value "$2" > /dev/null
            echo "  seeded $1"
          }

          put /cloud-agentic-iot/salesforce/consumer-key "$SF_CONSUMER_KEY"
          put /cloud-agentic-iot/salesforce/username     "$SF_USERNAME"
          put /cloud-agentic-iot/salesforce/login-url    "$SF_LOGIN_URL"
          put /cloud-agentic-iot/salesforce/instance     "$SF_INSTANCE"
          put /cloud-agentic-iot/slack/signing-secret    "$SLACK_SIGNING_SECRET"

          # SF_JWT_KEY is stored base64-encoded (same form the Salesforce deploy
          # uses); the Lambdas need the PEM itself.
          if [ -n "${SF_JWT_KEY:-}" ]; then
            printf '%s' "$SF_JWT_KEY" | base64 --decode > /tmp/sf.key
            aws ssm put-parameter --name /cloud-agentic-iot/salesforce/jwt-private-key \
              --type String --overwrite --value "$(cat /tmp/sf.key)" > /dev/null
            rm -f /tmp/sf.key
            echo "  seeded /cloud-agentic-iot/salesforce/jwt-private-key"
          else
            echo "::warning::SF_JWT_KEY not set, skipping jwt-private-key"
          fi

      - name: Validate every CloudFormation template before deploying anything
        run: |
          set -euo pipefail
          for stack in $(find . -name cloudformation.yaml -not -path "./node_modules/*"); do
            echo "Validating $stack"
            aws cloudformation validate-template --template-body "file://$stack" > /dev/null
          done

      # Slack is deployed separately, below. It is the only stack that depends
      # on a third-party app existing (the Slack signing secret), so bundling it
      # here meant one unconfigured integration failed the deploy of the device
      # pipeline, which has nothing to do with Slack.
      - name: Deploy core stacks
        run: |
          set -euo pipefail
          for stack in $(find . -name cloudformation.yaml -not -path "./node_modules/*"); do
            dir=$(dirname "$stack")
            name=$(basename "$dir")
            if [ "$name" = "slack-integration" ]; then continue; fi
            echo "::group::Deploying $stack"
            aws cloudformation deploy \
              --template-file "$stack" \
              --stack-name "cloud-agentic-iot-$name-${{ github.ref_name }}" \
              --capabilities CAPABILITY_NAMED_IAM \
              --no-fail-on-empty-changeset
            echo "::endgroup::"
          done

      # Skipped rather than failed when the Slack app has not been created yet.
      # The template reads /cloud-agentic-iot/slack/signing-secret from SSM, and
      # CloudFormation refuses to build a changeset when that parameter is
      # absent — so check first and say so plainly instead of dying on
      # "Unable to fetch parameters ... from parameter store".
      - name: Deploy Slack integration (optional)
        id: slack
        run: |
          set -euo pipefail
          if ! aws ssm get-parameter --name /cloud-agentic-iot/slack/signing-secret > /dev/null 2>&1; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SLACK_SIGNING_SECRET is not set, so /cloud-agentic-iot/slack/signing-secret does not exist. Skipping the Slack stack — everything else deployed. Set the secret on this environment to enable it."
            exit 0
          fi
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "::group::Deploying lambda/slack-integration/cloudformation.yaml"
          aws cloudformation deploy \
            --template-file lambda/slack-integration/cloudformation.yaml \
            --stack-name "cloud-agentic-iot-slack-integration-${{ github.ref_name }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset
          echo "::endgroup::"

      # The templates carry a placeholder inline handler so the stack can be
      # created standalone. Real source lives next to it in git, so every
      # directory holding an index.js is bundled and pushed over the top here —
      # without this step the stacks deploy green while running placeholder code.
      #
      # Only sources whose FunctionName is actually declared in a template are
      # packaged. The repo carries Lambda source for several functions whose
      # infrastructure has not been written yet (device-provisioning, ota-saga,
      # mcp-server and others), plus animations/src, which is not a Lambda at
      # all. Treating every index.js as deployable made this step fail on all of
      # them. Deriving the list from the templates keeps the real guard intact:
      # if a template declares a function and its source directory does not
      # match, that still fails loudly.
      - name: Package and upload real Lambda source
        env:
          SLACK_DEPLOYED: ${{ steps.slack.outputs.deployed }}
        run: |
          set -euo pipefail

          declared=$(grep -rh "FunctionName: cloud-agentic-iot" --include=cloudformation.yaml . \
                     | sed 's/.*FunctionName: //' | tr -d '\r' | sort -u)
          echo "Functions declared in templates:"; echo "$declared" | sed 's/^/  /'

          for src in $(find . -name index.js -not -path "./node_modules/*" -not -path "*/node_modules/*"); do
            dir=$(dirname "$src")
            fn="cloud-agentic-iot-$(basename "$dir")"

            if ! echo "$declared" | grep -qx "$fn"; then
              echo "::notice::Skipping $dir - no CloudFormation template declares $fn."
              continue
            fi

            # A skipped Slack stack is expected, not a mistake.
            if [ "$SLACK_DEPLOYED" != "true" ] && [ "$(basename "$dir")" = "slack-integration" ]; then
              echo "::notice::Skipping $dir - the Slack stack was not deployed."
              continue
            fi

            if ! aws lambda get-function --function-name "$fn" > /dev/null 2>&1; then
              echo "::error::$fn is declared in a template but does not exist in the account. \
          FunctionName must match cloud-agentic-iot-<source directory name>."
              exit 1
            fi

            echo "::group::Packaging $dir -> $fn"
            pushd "$dir" > /dev/null
            if [ -f package.json ]; then
              npm install --omit=dev --no-audit --no-fund
            fi
            zip -qr /tmp/"$fn".zip .
            popd > /dev/null

            aws lambda update-function-code \
              --function-name "$fn" \
              --zip-file fileb:///tmp/"$fn".zip \
              --publish > /dev/null
            echo "::endgroup::"
          done
