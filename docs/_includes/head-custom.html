<!-- Loaded on every docs page by the Primer theme. Keeps the Markdown GitHub-first:
     the fixes below happen only on the Pages site. -->
<style>
  .markdown-body .callout{border-left:4px solid #0969da;background:#ddf4ff33;padding:8px 16px;margin:16px 0;border-radius:6px;color:inherit}
  .markdown-body .callout.warning{border-color:#9a6700;background:#fff8c533}
  .markdown-body .callout .callout-title{font-weight:600;color:#0969da;margin-bottom:4px}
  .markdown-body .callout.warning .callout-title{color:#9a6700}
  .markdown-body .mermaid{background:#fff;text-align:center;margin:16px 0}
  .site-nav{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;margin:0 0 16px;padding-bottom:12px;border-bottom:1px solid #d0d7de}
  .markdown-body table{display:block;overflow-x:auto}
  .markdown-body .copy-wrap{position:relative}
  .markdown-body .copy-btn{position:absolute;top:6px;right:6px;font:12px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:5px 8px;border:1px solid #d0d7de;border-radius:6px;background:#f6f8fa;color:#24292f;cursor:pointer;opacity:.85}
  .markdown-body .copy-btn:hover,.markdown-body .copy-btn:focus{opacity:1}
  .markdown-body .copy-btn.done{border-color:#1a7f37;color:#1a7f37}
  .step-rail{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#fff;padding:8px 0;margin:0 0 12px;border-bottom:1px solid #d0d7de;font-size:13px}
  .step-rail .lbl{color:#59636e;margin-right:4px}
  .step-rail a{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:2px solid #8c959f;color:#1f2328;text-decoration:none;font-weight:600;background:#fff}
  .step-rail a.opt{border-style:dashed}
  .step-rail a.done{background:#1a7f37;border-color:#1a7f37;color:#fff}
  .step-rail a.cur{border-color:#0969da;box-shadow:0 0 0 3px #0969da40}
  .step-rail .count{margin-left:auto;color:#59636e}
  .markdown-body a[id^="step-"],.markdown-body a#resume{display:block;scroll-margin-top:60px}
  /* Landing and audience pages (index, Start here, PATH-*). On github.com these
     classes are stripped and the same HTML reads as plain headings and links. */
  .markdown-body .lp-hero{background:linear-gradient(180deg,#f0fdfa,#fff);border-radius:16px;padding:28px 28px 8px;margin:0 0 8px}
  .markdown-body .lp-eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#0f766e;margin:0}
  .markdown-body .lp-hero h1{font-size:36px;line-height:1.15;border:0;margin:8px 0 10px;color:#0f172a}
  .markdown-body .lp-lead{font-size:18px;line-height:1.5;color:#475569;max-width:760px}
  .markdown-body .lp-pills{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
  .markdown-body .lp-pills span{background:#ccfbf1;color:#115e59;border-radius:999px;padding:4px 12px;font-size:13px}
  .markdown-body .lp-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:16px 0 24px}
  .markdown-body .lp-card{border:1px solid #cbd5e1;border-radius:14px;padding:18px;background:#fff;display:flex;flex-direction:column}
  .markdown-body .lp-card img{width:44px;height:44px;margin:0}
  .markdown-body .lp-card h3{font-size:17px;margin:10px 0 6px;border:0;padding:0}
  .markdown-body .lp-card p{color:#475569;font-size:14px;line-height:1.45;margin:0 0 12px;flex:1}
  .markdown-body .lp-card .lp-go{font-weight:600}
  .markdown-body .lp-card .lp-meta{font-size:12px;color:#64748b;border-top:1px solid #e2e8f0;padding-top:10px;margin:10px 0 0;flex:0}
  .markdown-body .lp-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:12px 0 24px}
  .markdown-body .lp-stats div{background:#f8fafc;border-radius:12px;padding:14px;font-size:13px;color:#475569}
  .markdown-body .lp-stats b{display:block;font-size:22px;color:#0f766e}
  .markdown-body .lp-head{display:flex;gap:16px;align-items:center}
  .markdown-body .lp-head img{width:56px;height:56px}
  .markdown-body .lp-crumb{font-size:13px;color:#64748b;margin:0}
  .markdown-body .lp-layout{display:grid;grid-template-columns:2fr 1fr;gap:24px;align-items:start}
  @media (max-width:760px){.markdown-body .lp-layout{grid-template-columns:1fr}.markdown-body .lp-hero h1{font-size:28px}}
  .markdown-body .lp-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
  .markdown-body .lp-step{display:flex;gap:14px;border:1px solid #e2e8f0;border-radius:12px;padding:14px;counter-increment:lpstep}
  .markdown-body .lp-steps{counter-reset:lpstep;margin-bottom:16px}
  .markdown-body .lp-step::before{content:counter(lpstep);flex:none;width:34px;height:34px;border-radius:50%;background:#0f766e;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
  .markdown-body .lp-step h4{margin:2px 0 4px;font-size:15px}
  .markdown-body .lp-step p{margin:0;font-size:13px;color:#475569}
  .markdown-body .lp-step .lp-check{margin-top:6px;color:#166534}
  .markdown-body .lp-box{background:#f0fdfa;border-radius:14px;padding:16px 18px;font-size:14px;color:#334155;margin:0 0 14px}
  .markdown-body .lp-box h4{margin:0 0 8px;color:#134e4a}
  .markdown-body .lp-box ul{padding-left:18px;margin:0}
  .markdown-body .lp-side img{border:1px solid #e2e8f0;border-radius:12px;margin-bottom:14px}
  body.lp-page .markdown-body > h1:first-of-type:not(.lp-title){display:none}
  /* Platform icons (docs/images/platforms): self-drawn badges, not brand logos. */
  .markdown-body img.pi{display:inline-block;width:20px;height:20px;vertical-align:-4px;margin:0 2px 0 0;border:0;background:none}
  .markdown-body .lp-pis{margin:0 0 4px !important}
  .markdown-body .lp-legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px 16px;margin:8px 0 24px;font-size:14px}
  .markdown-body .lp-legend div{display:grid;grid-template-columns:24px 1fr;column-gap:6px;align-items:start;align-content:start}
  .markdown-body .lp-legend span{grid-column:2;color:#59636e;font-size:13px;line-height:1.35}
  .site-nav{align-items:center}
  .site-nav .gh{display:inline-flex;gap:6px;align-items:center}
  .site-nav .gh svg{width:16px;height:16px;fill:currentColor}
  .site-nav .hire{margin-left:auto;background:#0f766e;color:#fff !important;border-radius:999px;padding:6px 14px;font-weight:600;text-decoration:none}
  .site-nav .hire:hover{background:#115e59}
  /* "Test every feature" call to action at the end of the install guides. */
  .markdown-body .cta{margin:20px 0 8px}
  .markdown-body .cta a{display:inline-block;border-radius:999px;transition:transform .15s,filter .15s}
  .markdown-body .cta a:hover,.markdown-body .cta a:focus{transform:translateY(-2px);filter:brightness(1.08)}
  .markdown-body .cta img{display:block;width:560px;max-width:100%;height:auto;border:0;background:none}
  .markdown-body .step-done{display:flex;gap:8px;align-items:center;margin-top:8px;font-weight:600;cursor:pointer}
  @media (prefers-color-scheme: dark){.step-rail,.step-rail a{background:#0d1117;color:#e6edf3}}
</style>
<script type="module">
  const REPO = "https://github.com/CloudArchitect101/Cloud-Agentic-IoT/blob/Dev/";
  const ready = new Promise(r => document.readyState !== "loading" ? r() : document.addEventListener("DOMContentLoaded", r));
  await ready;
  const body = document.querySelector(".markdown-body") || document.body;

  // A short nav bar on every page.
  const nav = document.createElement("nav");
  nav.className = "site-nav";
  // The GitHub mark is GitHub's Octicon (MIT licence), used as GitHub asks: to link to the repository.
  const GH_MARK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path></svg>';
  nav.innerHTML = [["Home", ""], ["Start here", "START-HERE"], ["Walkthrough", "process/"], ["Quick Install Guide", "INSTALL"], ["Detailed Install Guide", "INSTALL-GUIDE"],
    ["Chapters", "CHAPTERS"]]
    .map(([t, h]) => `<a href="/Cloud-Agentic-IoT/${h}">${t}</a>`).join("")
    + `<a class="gh" href="https://github.com/CloudArchitect101/Cloud-Agentic-IoT" title="The code on GitHub">${GH_MARK}GitHub</a>`
    + `<a class="hire" href="https://cloudarchitect101.com/about" target="_blank" rel="noopener">Hire Me Now</a>`;
  body.prepend(nav);
  // Landing pages draw their own heading, so the theme's site title (the first h1) is hidden there.
  if (body.querySelector(".lp-hero")) document.body.classList.add("lp-page");

  // Links to files outside docs/ (the README, firmware, scripts) go to GitHub.
  for (const a of body.querySelectorAll('a[href^="../"]')) a.href = REPO + a.getAttribute("href").replace(/^\.\.\//, "");
  // A .md link the plugin left alone (one that spans two lines) goes to the page.
  for (const a of body.querySelectorAll('a[href]')) {
    const h = a.getAttribute("href");
    if (!/^[a-z]+:/i.test(h) && /\.md(#|$)/.test(h)) a.setAttribute("href", h.replace(/\.md(#|$)/, "$1"));
  }

  // GitHub callouts: > [!NOTE] and > [!WARNING].
  for (const q of body.querySelectorAll("blockquote")) {
    const p = q.querySelector("p");
    const m = p && p.innerHTML.match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*/);
    if (!m) continue;
    p.innerHTML = p.innerHTML.slice(m[0].length);
    const kind = m[1].toLowerCase();
    q.classList.add("callout", kind === "warning" || kind === "caution" ? "warning" : "note");
    q.insertAdjacentHTML("afterbegin", `<div class="callout-title">${m[1][0] + m[1].slice(1).toLowerCase()}</div>`);
  }

  // A Copy button on every code block, as on GitHub. It copies the text as shown,
  // so a "Fill in first" placeholder still has to be replaced after pasting.
  const copyText = async (text) => {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {
      const t = document.createElement("textarea");
      t.value = text; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
      document.body.append(t); t.select();
      const ok = document.execCommand("copy"); t.remove(); return ok;
    }
  };
  for (const pre of body.querySelectorAll("pre")) {
    const code = pre.querySelector("code") || pre;
    if (code.classList.contains("language-mermaid") || pre.closest(".language-mermaid")) continue;
    const box = pre.closest("div.highlighter-rouge") || pre;
    const wrap = box === pre ? (() => { const w = document.createElement("div"); pre.before(w); w.append(pre); return w; })() : box;
    wrap.classList.add("copy-wrap");
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "copy-btn"; btn.textContent = "Copy";
    btn.setAttribute("aria-label", "Copy this code");
    btn.addEventListener("click", async () => {
      const ok = await copyText(code.innerText.replace(/\n$/, ""));
      btn.textContent = ok ? "Copied" : "Press Ctrl+C";
      btn.classList.toggle("done", ok);
      setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("done"); }, 1500);
    });
    wrap.append(btn);
  }

  // The step map on the Quick Install Guide: a sticky row of numbered dots, one per step,
  // that shows where you are and which steps you ticked as done (kept in this browser only).
  const stepAnchors = [...body.querySelectorAll('a[id^="step-"]')].filter(a => /^step-\d+$/.test(a.id));
  if (stepAnchors.length > 3) {
    const KEY = "cai-steps-done:" + location.pathname;
    const load = () => { try { return new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) { return new Set(); } };
    const save = (set) => { try { localStorage.setItem(KEY, JSON.stringify([...set])); } catch (e) {} };
    const done = load();
    const optional = new Set(), titles = {};
    for (const row of body.querySelectorAll("table tr")) {
      const cells = row.querySelectorAll("td");
      const link = cells[0] && cells[0].querySelector('a[href^="#step-"]');
      if (link && cells.length >= 4) {
        const n = link.getAttribute("href").slice(6);
        titles[n] = cells[1].textContent.trim();
        if (/optional/i.test(cells[3].textContent)) optional.add(n);
      }
    }
    const rail = document.createElement("nav");
    rail.className = "step-rail";
    rail.setAttribute("aria-label", "Install steps");
    rail.innerHTML = '<span class="lbl">Steps</span>' + stepAnchors.map(a => {
      const n = a.id.slice(5);
      return `<a href="#step-${n}" data-n="${n}" class="${optional.has(n) ? "opt" : ""}" title="${n}. ${(titles[n] || "").replace(/"/g, "&quot;")}${optional.has(n) ? " (optional)" : ""}">${n}</a>`;
    }).join("") + '<span class="count"></span>';
    const nav = body.querySelector(".site-nav");
    (nav || body.firstChild).after(rail);
    const dots = [...rail.querySelectorAll("a")];
    const paint = () => {
      for (const d of dots) d.classList.toggle("done", done.has(d.dataset.n));
      rail.querySelector(".count").textContent = `${done.size} of ${dots.length} done`;
    };
    // A "done" tick at the end of each step's check box.
    // kramdown wraps a lone <a id> in a <p>, so walk from that block.
    const blockOf = (a) => (a.parentElement && a.parentElement.tagName === "P" && a.parentElement.textContent.trim() === "") ? a.parentElement : a;
    const starts = new Set(stepAnchors.map(blockOf));
    for (const a of stepAnchors) {
      const n = a.id.slice(5);
      let el = blockOf(a).nextElementSibling, box = null;
      while (el && !starts.has(el)) {
        if (el.classList && el.classList.contains("callout") && /Check before you go on/.test(el.textContent)) box = el;
        el = el.nextElementSibling;
      }
      if (!box) continue;
      const label = document.createElement("label");
      label.className = "step-done";
      label.innerHTML = `<input type="checkbox"> I see this: step ${n} is done`;
      const cb = label.querySelector("input");
      cb.checked = done.has(n);
      cb.addEventListener("change", () => { cb.checked ? done.add(n) : done.delete(n); save(done); paint(); });
      box.append(label);
    }
    // Highlight the step on screen.
    const current = () => {
      let cur = stepAnchors[0];
      for (const a of stepAnchors) if (a.getBoundingClientRect().top < 120) cur = a;
      for (const d of dots) d.classList.toggle("cur", "step-" + d.dataset.n === cur.id);
    };
    addEventListener("scroll", current, { passive: true });
    paint(); current();
  }

  // Mermaid diagrams, drawn the way GitHub draws them.
  const blocks = body.querySelectorAll("pre code.language-mermaid, .language-mermaid pre code");
  if (blocks.length) {
    for (const code of blocks) {
      const div = document.createElement("div");
      div.className = "mermaid";
      div.textContent = code.textContent;
      (code.closest("div.language-mermaid") || code.closest("pre")).replaceWith(div);
    }
    const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs");
    mermaid.initialize({ startOnLoad: false, theme: "default", securityLevel: "strict" });
    await mermaid.run({ querySelector: ".mermaid" });
  }
</script>
