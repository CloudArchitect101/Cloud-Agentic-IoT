<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud-Agentic-IoT process</title>
<style>
:root{color-scheme:light dark;--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--accent:#0969da;--line:#d0d7de;--btn:#f6f8fa}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--accent:#4493f8;--line:#30363d;--btn:#21262d}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif}
main{max-width:1000px;margin:0 auto;padding:24px 16px}
h1{font-size:22px;margin:0 0 4px} p.lead{color:var(--muted);margin:0 0 16px}
svg{width:100%;height:auto;display:block}

.bg{fill:#ffffff;stroke:#d0d7de}
.node rect{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.5}
.node text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#1f2328}
.node .t{font-size:16px;font-weight:600;text-anchor:middle}
.node .s{font-size:13px;fill:#59636e;text-anchor:middle}
.node .num{font-size:13px;font-weight:700;fill:#59636e}
.edge{fill:none;stroke:#8c959f;stroke-width:2}
#arrow path{fill:#8c959f}
.node .hi{fill:#0969da;fill-opacity:.12;stroke:#0969da;stroke-width:3;opacity:0}
.eh{fill:none;stroke:#0969da;stroke-width:3;opacity:0}
#arrowon path{fill:#0969da}
.on .hi,.eh.on{opacity:1}
.cap{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;font-size:16px;fill:#1f2328}
.cap .k{font-weight:700;fill:#0969da}
.title{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;font-size:13px;fill:#59636e;letter-spacing:.08em}

@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#30363d}
.node rect{fill:#161b22;stroke:#6e7681}
.node text,.cap{fill:#e6edf3}
.node .s,.node .num,.title{fill:#9198a1}
.edge{stroke:#6e7681}#arrow path{fill:#6e7681}
.node .hi{fill:#4493f8;fill-opacity:.18;stroke:#4493f8}.cap .k{fill:#4493f8}
.eh{stroke:#4493f8}#arrowon path{fill:#4493f8}
}

.hi,.eh{transition:opacity .3s}
.node{cursor:pointer}
.panel{border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px;min-height:96px}
.k{color:var(--accent);font-weight:700} code a{color:var(--accent)}
.bar{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
button{background:var(--btn);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:15px;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent)}
.dots{display:flex;gap:6px;margin-left:auto} .dot{width:10px;height:10px;border-radius:50%;background:var(--line)} .dot.on{background:var(--accent)}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>From a warm sensor to an agent answer</h1>
<p class="lead">Step through the process with the buttons, the arrow keys, or click a box. <a href="../">Docs home</a> · <a href="https://github.com/CloudArchitect101/Cloud-Agentic-IoT">Code on GitHub</a></p>
<svg viewBox="0 0 960 310" role="img" aria-label="Process diagram"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker><marker id="arrowon" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" x="0.5" y="0.5" width="959" height="309" rx="14"/><text class="title" x="40" y="32">FROM A WARM SENSOR TO AN AGENT ANSWER</text><g class="node n0"><rect x="40" y="50" width="190" height="86" rx="12"/><rect class="hi" x="40" y="50" width="190" height="86" rx="12"/><text class="num" x="56" y="76">1</text><text class="t" x="135.0" y="92">ESP32 board</text><text class="s" x="135.0" y="114">DHT11 + servo</text></g>
<g class="node n1"><rect x="270" y="50" width="190" height="86" rx="12"/><rect class="hi" x="270" y="50" width="190" height="86" rx="12"/><text class="num" x="286" y="76">2</text><text class="t" x="365.0" y="92">AWS IoT Core</text><text class="s" x="365.0" y="114">mutual TLS</text></g>
<g class="node n2"><rect x="500" y="50" width="190" height="86" rx="12"/><rect class="hi" x="500" y="50" width="190" height="86" rx="12"/><text class="num" x="516" y="76">3</text><text class="t" x="595.0" y="92">patient-vitals</text><text class="s" x="595.0" y="114">Lambda</text></g>
<g class="node n3"><rect x="730" y="50" width="190" height="86" rx="12"/><rect class="hi" x="730" y="50" width="190" height="86" rx="12"/><text class="num" x="746" y="76">4</text><text class="t" x="825.0" y="92">Salesforce Case</text><text class="s" x="825.0" y="114">Care_Team_Queue</text></g>
<g class="node n4"><rect x="730" y="210" width="190" height="86" rx="12"/><rect class="hi" x="730" y="210" width="190" height="86" rx="12"/><text class="num" x="746" y="236">5</text><text class="t" x="825.0" y="252">Ward board</text><text class="s" x="825.0" y="274">queue indicator</text></g>
<g class="node n5"><rect x="500" y="210" width="190" height="86" rx="12"/><rect class="hi" x="500" y="210" width="190" height="86" rx="12"/><text class="num" x="516" y="236">6</text><text class="t" x="595.0" y="252">Patient Care Agent</text><text class="s" x="595.0" y="274">Agentforce</text></g>
<g class="node n6"><rect x="270" y="210" width="190" height="86" rx="12"/><rect class="hi" x="270" y="210" width="190" height="86" rx="12"/><text class="num" x="286" y="236">7</text><text class="t" x="365.0" y="252">SOP search</text><text class="s" x="365.0" y="274">Bedrock Titan V2</text></g>
<g class="node n7"><rect x="40" y="210" width="190" height="86" rx="12"/><rect class="hi" x="40" y="210" width="190" height="86" rx="12"/><text class="num" x="56" y="236">8</text><text class="t" x="135.0" y="252">Escalate + measure</text><text class="s" x="135.0" y="274">Case, dashboard</text></g>
<path class="edge" d="M230 93.0 H262" marker-end="url(#arrow)"/><path class="eh e0" d="M230 93.0 H262" marker-end="url(#arrowon)"/>
<path class="edge" d="M460 93.0 H492" marker-end="url(#arrow)"/><path class="eh e1" d="M460 93.0 H492" marker-end="url(#arrowon)"/>
<path class="edge" d="M690 93.0 H722" marker-end="url(#arrow)"/><path class="eh e2" d="M690 93.0 H722" marker-end="url(#arrowon)"/>
<path class="edge" d="M825.0 136 V202" marker-end="url(#arrow)"/><path class="eh e3" d="M825.0 136 V202" marker-end="url(#arrowon)"/>
<path class="edge" d="M730 253.0 H698" marker-end="url(#arrow)"/><path class="eh e4" d="M730 253.0 H698" marker-end="url(#arrowon)"/>
<path class="edge" d="M500 253.0 H468" marker-end="url(#arrow)"/><path class="eh e5" d="M500 253.0 H468" marker-end="url(#arrowon)"/>
<path class="edge" d="M270 253.0 H238" marker-end="url(#arrow)"/><path class="eh e6" d="M270 253.0 H238" marker-end="url(#arrowon)"/></svg>
<div class="panel" aria-live="polite"><div><span class="k" id="num"></span></div><p id="cap"></p><div>In the repo: <code><a id="where" target="_blank" rel="noopener"></a></code></div></div>
<div class="bar"><button id="prev">&larr; Prev</button><button id="next">Next &rarr;</button><button id="play">&#9654; Play</button><div class="dots" id="dots"></div></div>
</main>
<script>
const STEPS = [{"title": "ESP32 board", "caption": "The board reads 31 C. Its own motor starts turning within about 5 s, decided on the board, so it works offline too.", "where": "firmware/patient-monitor/"}, {"title": "AWS IoT Core", "caption": "The reading goes to AWS IoT Core over mutual TLS, with a certificate that lives only on the board.", "where": "firmware/libraries/CloudAgenticDevice/"}, {"title": "patient-vitals", "caption": "The patient-vitals Lambda stores every reading in DynamoDB and S3, and flags the one that crossed 30 C.", "where": "lambda/patient-vitals/"}, {"title": "Salesforce Case", "caption": "Salesforce saves the flagged reading and opens one Case for the device in the care team's queue.", "where": "force-app/main/default/classes/RoomTemperatureCaseService.cls"}, {"title": "Ward board", "caption": "The queue depth goes back to AWS over a SigV4-signed call, and the ward board starts spinning.", "where": "lambda/queue-relay/"}, {"title": "Patient Care Agent", "caption": "A nurse asks the Patient Care Agent what the device reports. It reads the device through its actions.", "where": "force-app/main/default/aiAuthoringBundles/"}, {"title": "SOP search", "caption": "Asked what to do, the agent finds the ward procedure with Bedrock embeddings and cites its SOP ID.", "where": "lambda/procedure-search/"}, {"title": "Escalate + measure", "caption": "After the nurse confirms, the agent escalates. The Business Value dashboard measures response time and cost.", "where": "force-app/main/default/dashboards/"}];
const REPO = "https://github.com/CloudArchitect101/Cloud-Agentic-IoT/tree/Dev/";
let i = 0, timer = null;
const dots = document.getElementById("dots");
STEPS.forEach(() => dots.appendChild(Object.assign(document.createElement("span"), {className: "dot"})));
function show(n) {
  i = (n + STEPS.length) % STEPS.length;
  document.querySelectorAll(".node").forEach((g, k) => g.classList.toggle("on", k === i));
  document.querySelectorAll(".eh").forEach((e, k) => e.classList.toggle("on", k === i - 1));
  [...dots.children].forEach((d, k) => d.classList.toggle("on", k === i));
  document.getElementById("num").textContent = `Step ${i + 1} of ${STEPS.length}: ${STEPS[i].title}`;
  document.getElementById("cap").textContent = STEPS[i].caption;
  const w = document.getElementById("where");
  w.textContent = STEPS[i].where; w.href = REPO + STEPS[i].where;
}
function stop() { clearInterval(timer); timer = null; document.getElementById("play").innerHTML = "&#9654; Play"; }
document.getElementById("prev").onclick = () => { stop(); show(i - 1); };
document.getElementById("next").onclick = () => { stop(); show(i + 1); };
document.getElementById("play").onclick = () => {
  if (timer) return stop();
  document.getElementById("play").innerHTML = "&#10074;&#10074; Pause";
  timer = setInterval(() => show(i + 1), 3000);
};
document.querySelectorAll(".node").forEach((g, k) => g.addEventListener("click", () => { stop(); show(k); }));
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") { stop(); show(i + 1); }
  if (e.key === "ArrowLeft") { stop(); show(i - 1); }
});
show(0);
</script>
</body>
</html>
