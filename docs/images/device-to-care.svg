<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="t d">
  <title id="t">From a monitored device to the care team</title>
  <desc id="d">A monitored device measures temperature and sends readings to AWS IoT Core. At 30 C a temperature alert opens one Case for the care team in Salesforce, and an Agentforce agent answers questions in Salesforce, Slack and a portal.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker>
    <style>
      .card{fill:#ffffff;stroke:#99d5cf;stroke-width:2}
      .t{font:600 19px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#134e4a;text-anchor:middle}
      .s{font:14px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#475569;text-anchor:middle}
      .k{font:700 12px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#0f766e;letter-spacing:.08em;text-anchor:middle}
      .ln{fill:none;stroke:#0f766e;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .flow{fill:none;stroke:#0f766e;stroke-width:2.5;marker-end:url(#ar)}
      .pill{font:700 12px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#fff;text-anchor:middle}
      .lbl{font:600 13px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#0f766e;text-anchor:middle}
    </style>
  </defs>
  <rect width="1000" height="320" rx="16" fill="#f0fdfa"/>
  <!-- 1 device -->
  <g transform="translate(30,40)">
    <rect class="card" width="200" height="240" rx="14"/>
    <text class="k" x="100" y="30">1 · SENSE</text>
    <rect class="ln" x="72" y="50" width="56" height="62" rx="8"/>
    <path class="ln" d="M86 62h28M86 74h28M86 86h28M86 98h16"/>
    <path class="ln" d="M150 56v40a10 10 0 1 1-12 0V56a6 6 0 0 1 12 0z"/>
    <text class="t" x="100" y="148">Monitored device</text>
    <text class="s" x="100" y="172">ESP32 + temperature</text>
    <text class="s" x="100" y="192">sensor, alert motor</text>
  </g>
  <!-- 2 aws -->
  <g transform="translate(275,40)">
    <rect class="card" width="200" height="240" rx="14"/>
    <text class="k" x="100" y="30">2 · STREAM</text>
    <path class="ln" d="M70 104h62a20 20 0 0 0 0-40a28 28 0 0 0-54-6a18 18 0 0 0-8 46z"/>
    <path class="ln" d="M92 84l8-8l8 8M100 76v20"/>
    <text class="t" x="100" y="148">AWS IoT Core</text>
    <text class="s" x="100" y="172">mutual TLS, a rule</text>
    <text class="s" x="100" y="192">flags 30 C or more</text>
  </g>
  <!-- 3 salesforce -->
  <g transform="translate(520,40)">
    <rect class="card" width="200" height="240" rx="14"/>
    <text class="k" x="100" y="30">3 · ALERT</text>
    <rect class="ln" x="70" y="52" width="60" height="64" rx="6"/>
    <path class="ln" d="M84 70h32M84 84h32M84 98h18"/>
    <circle cx="132" cy="54" r="11" fill="#f59e0b"/>
    <text x="132" y="59" font-family="Arial" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">!</text>
    <text class="t" x="100" y="148">Salesforce</text>
    <text class="s" x="100" y="172">one temperature alert</text>
    <text class="s" x="100" y="192">Case for the care team</text>
  </g>
  <!-- 4 agent -->
  <g transform="translate(765,40)">
    <rect class="card" width="205" height="240" rx="14"/>
    <text class="k" x="102" y="30">4 · ACT</text>
    <path class="ln" d="M68 56h66a10 10 0 0 1 10 10v30a10 10 0 0 1-10 10H96l-16 12v-12H68a10 10 0 0 1-10-10V66a10 10 0 0 1 10-10z"/>
    <circle cx="84" cy="81" r="3.5" fill="#0f766e"/><circle cx="101" cy="81" r="3.5" fill="#0f766e"/><circle cx="118" cy="81" r="3.5" fill="#0f766e"/>
    <text class="t" x="102" y="148">Agentforce agent</text>
    <text class="s" x="102" y="172">answers from readings</text>
    <text class="s" x="102" y="192">and procedures</text>
  </g>
<g transform="translate(30,40)"><rect x="58" y="206" width="84" height="22" rx="11" fill="#E7352C"/><text class="pill" x="100" y="221" style="fill:#fff">ESP32</text></g><g transform="translate(275,40)"><rect x="58" y="206" width="84" height="22" rx="11" fill="#232F3E"/><text class="pill" x="100" y="221" style="fill:#FF9900">AWS</text></g><g transform="translate(520,40)"><rect x="58" y="206" width="84" height="22" rx="11" fill="#0176D3"/><text class="pill" x="100" y="221" style="fill:#fff">Salesforce</text></g><g transform="translate(765,40)"><rect x="60" y="206" width="84" height="22" rx="11" fill="#0176D3"/><text class="pill" x="102" y="221" style="fill:#fff">Agentforce</text></g>
  <path class="flow" d="M232 150h40"/>
  <path class="flow" d="M477 150h40"/>
  <path class="flow" d="M722 150h40"/>
  <text class="lbl" x="500" y="308">Salesforce · Slack · portal · the board's own motor works offline</text>
</svg>
