<template>
    <lightning-card title="Queue Depth — Physical Indicator" icon-name="standard:service_request">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <p class="slds-text-heading_small slds-p-bottom_x-small">{statusLabel}</p>
            <div class="slds-progress-bar" aria-label="Queue intensity">
                <span class="slds-progress-bar__value" style={barStyle}></span>
            </div>
            <p class="slds-text-body_small slds-text-color_weak slds-p-top_x-small">
                Mirrors the servo on the desk — both subscribe to Queue_Depth_Change__e.
                <template lwc:if={lastUpdate}>&nbsp;Last event: {lastUpdate}</template>
            </p>
        </div>
    </lightning-card>
</template>
