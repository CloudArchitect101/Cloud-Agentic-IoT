AWSTemplateFormatVersion: '2010-09-09'
Description: Cloud-Agentic-IoT Branch 02 - Real-time Streams to Agents (EventBridge + Platform Events)

# The alert dispatcher reaches Salesforce through the JWT bearer flow in
# lambda/shared/salesforce.js, like every other function: the long-lived
# session token this template used to take, and the instance name it built a
# URL from, are gone. Values below come from config/<env>.json ("streaming").
Parameters:
  # Seeded from GitHub Environment secrets by the seed step in
  # .github/workflows/deploy.yml.
  SfConsumerKeyParam:
    Type: 'AWS::SSM::Parameter::Value<String>'
    Default: /cloud-agentic-iot/salesforce/consumer-key
  SfUsernameParam:
    Type: 'AWS::SSM::Parameter::Value<String>'
    Default: /cloud-agentic-iot/salesforce/username
  SfLoginUrlParam:
    Type: 'AWS::SSM::Parameter::Value<String>'
    Default: /cloud-agentic-iot/salesforce/login-url
  # Names the function reads at runtime: a SecureString cannot be resolved
  # into a template, and the bands change without a deploy.
  SalesforceJwtKeyParameterName:
    Type: String
    Default: /cloud-agentic-iot/salesforce/jwt-private-key
    AllowedPattern: '^/.+'
  ThresholdsParameterName:
    Type: String
    Default: /cloud-agentic-iot/config/vital-thresholds
    AllowedPattern: '^/.+'
  SalesforceApiVersion:
    Type: String
    Default: '64.0'
    AllowedPattern: '^\d+\.\d$'
  SalesforceTokenCacheMinutes:
    Type: Number
    Default: 30
    MinValue: 1
  ConfigCacheSeconds:
    Type: Number
    Default: 300
    MinValue: 0
  AlertRetryAttempts:
    Type: Number
    Default: 2
    MinValue: 0
    MaxValue: 185
  AlertMaxEventAgeSeconds:
    Type: Number
    Default: 3600
    MinValue: 60
    MaxValue: 86400
  # scripts/deploy-aws.sh passes the alarms stack's topic (infra/alarms).
  AlarmTopicArn:
    Type: String
    Default: ''
    Description: SNS topic for the alarm below. Empty, it shows in CloudWatch only.

Conditions:
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, '']]

Resources:
  # EventBridge Bus for patient vitals events
  PatientVitalsEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: patient-vitals-event-bus

  # EventBridge Rule to route telemetry events to alert dispatcher
  #
  # Corrected against the resource schema: EventBusId is not a property
  # (EventBusName is), EventPattern uses detail-type not detailType, and a
  # target takes RetryPolicy + DeadLetterConfig - RetryConfig/DestinationOptions
  # /OnSuccess do not exist and were what failed early validation.
  TelemetryToAlertRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref PatientVitalsEventBus
      EventPattern:
        source: ['patient.iot.wearable']
        detail-type: ['patient.vitals.update']
      State: ENABLED
      Targets:
        - Arn: !GetAtt AlertDispatcherLambda.Arn
          Id: AlertDispatcher
          RetryPolicy:
            MaximumRetryAttempts: !Ref AlertRetryAttempts
            MaximumEventAgeInSeconds: !Ref AlertMaxEventAgeSeconds
          DeadLetterConfig:
            Arn: !GetAtt AlertDLQ.Arn
        # The event router is not a target. It is the publisher: every event
        # it receives from this rule it would publish straight back to the
        # same bus, which matches this rule again - an endless loop.

  # Rules do not implicitly get permission to invoke their targets.
  AlertDispatcherInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt AlertDispatcherLambda.Arn
      Principal: events.amazonaws.com
      SourceArn: !GetAtt TelemetryToAlertRule.Arn

  # Alert Dispatcher Lambda
  AlertDispatcherRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        # The bands, and the Salesforce private key (a SecureString, which
        # SSM decrypts with KMS on the function's behalf).
        - PolicyName: ReadSettings
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ThresholdsParameterName}'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SalesforceJwtKeyParameterName}'
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  AlertDispatcherLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cloud-agentic-iot-alert-dispatcher
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt AlertDispatcherRole.Arn
      Timeout: 30
      MemorySize: 256
      Code:
        ZipFile: |
          exports.handler = async () => ({
            statusCode: 200,
            body: 'Placeholder - the deploy pipeline replaces this with the real bundle'
          });
      Environment:
        Variables:
          SALESFORCE_CLIENT_ID: !Ref SfConsumerKeyParam
          SALESFORCE_USERNAME: !Ref SfUsernameParam
          SALESFORCE_LOGIN_URL: !Ref SfLoginUrlParam
          SALESFORCE_JWT_KEY_PARAMETER: !Ref SalesforceJwtKeyParameterName
          SALESFORCE_API_VERSION: !Ref SalesforceApiVersion
          SALESFORCE_TOKEN_CACHE_MINUTES: !Ref SalesforceTokenCacheMinutes
          THRESHOLDS_PARAMETER: !Ref ThresholdsParameterName
          CONFIG_CACHE_SECONDS: !Ref ConfigCacheSeconds

  # The event router: publishes validated telemetry to the bus above.
  # The logical IDs still say DataSink so that existing stacks update this
  # function in place instead of trying to recreate it under the same name.
  #
  # Nothing invokes it, deliberately. Wired to device/+/telemetry it would put
  # every reading on the bus: 33,000 events a second at a million devices,
  # past EventBridge's PutEvents quota and about as costly as IoT Core itself.
  # To drive alerts at that scale, feed it from patient-vitals' sync queue,
  # which carries state changes only (docs/SCALING.md).
  DataSinkRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      # It had no policies at all: no logs, and no permission to publish the
      # events it exists to publish.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: PublishToPatientVitalsBus
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !GetAtt PatientVitalsEventBus.Arn

  DataSinkLambda:
    Type: AWS::Lambda::Function
    Properties:
      # Named to match its source directory (lambda/streaming/event-router) so
      # the deploy pipeline can map source to function without a lookup table.
      FunctionName: cloud-agentic-iot-event-router
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt DataSinkRole.Arn
      Timeout: 30
      MemorySize: 256
      Code:
        ZipFile: |
          exports.handler = async () => ({
            statusCode: 200,
            body: 'Placeholder - the deploy pipeline replaces this with the real bundle'
          });
      Environment:
        Variables:
          EVENT_BUS_NAME: !Ref PatientVitalsEventBus

  # Dead Letter Queue for failed events
  AlertDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: patient-vitals-alert-dlq
      VisibilityTimeout: 300

  # EventBridge can only write to a dead-letter queue whose policy lets it.
  # Without this, an event that exhausts its retries is dropped instead.
  AlertDLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref AlertDLQ
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt AlertDLQ.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt TelemetryToAlertRule.Arn

  # An alert that failed every retry lands here, and nobody in Salesforce
  # hears of it. This says so.
  AlertDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: cloud-agentic-iot-alert-dead-letters
      AlarmDescription: Alerts failed every retry and never reached Salesforce. Inspect patient-vitals-alert-dlq and the alert-dispatcher logs.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt AlertDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

Outputs:
  PatientVitalsEventBusArn:
    Description: EventBridge bus ARN
    Value: !GetAtt PatientVitalsEventBus.Arn

  AlertDispatcherLambdaArn:
    Description: Alert dispatcher Lambda ARN
    Value: !GetAtt AlertDispatcherLambda.Arn
