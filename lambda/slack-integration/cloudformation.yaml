AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Headless Slack <-> Salesforce integration. Slack slash commands hit API
  Gateway, which invokes a Lambda that authenticates to Salesforce via the
  JWT Bearer Flow (a dedicated integration user — no per-user Salesforce
  login anywhere in this path) and reads/writes records.

# Values below come from config/<env>.json ("slack-integration").
Parameters:
  # Secrets are SecureStrings, read by the function at runtime: CloudFormation
  # cannot resolve a SecureString into a template, and an environment variable
  # is readable by anyone allowed to see the function's configuration.
  SlackSigningSecretParameterName:
    Type: String
    Default: /cloud-agentic-iot/slack/signing-secret
    AllowedPattern: '^/.+'
  SalesforceJwtKeyParameterName:
    Type: String
    Default: /cloud-agentic-iot/salesforce/jwt-private-key
    AllowedPattern: '^/.+'
  SalesforceApiVersion:
    Type: String
    Default: '64.0'
    AllowedPattern: '^\d+\.\d$'
  SalesforceTokenCacheMinutes:
    Type: Number
    Default: 30
    MinValue: 1
  ConfigCacheSeconds:
    Type: Number
    Default: 300
    MinValue: 0
  SfConsumerKeyParam:
    Type: 'AWS::SSM::Parameter::Value<String>'
    Default: /cloud-agentic-iot/salesforce/consumer-key
  SfUsernameParam:
    Type: 'AWS::SSM::Parameter::Value<String>'
    Default: /cloud-agentic-iot/salesforce/username
  SfLoginUrlParam:
    Type: 'AWS::SSM::Parameter::Value<String>'
    Default: /cloud-agentic-iot/salesforce/login-url

Resources:
  SlackIntegrationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SlackSigningSecretParameterName}'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SalesforceJwtKeyParameterName}'
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  SlackIntegrationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cloud-agentic-iot-slack-integration
      # nodejs22.x, not 20: this is the one Lambda that bundles jsforce, and
      # jsforce 3 depends on undici 8, which declares "node": ">=22.19.0".
      # On nodejs20.x the cold start dies inside require('jsforce') with
      # "webidl.util.markAsUncloneable is not a function" before the handler
      # is ever reached. The other functions here use only the AWS SDK and
      # are unaffected.
      Runtime: nodejs22.x
      Handler: index.handler
      Timeout: 10
      Role: !GetAtt SlackIntegrationRole.Arn
      Code:
        ZipFile: |
          exports.handler = async () => ({
            statusCode: 200,
            body: 'Placeholder - deploy pipeline replaces this with the real index.js/salesforce-client.js bundle'
          });
      Environment:
        Variables:
          SLACK_SIGNING_SECRET_PARAMETER: !Ref SlackSigningSecretParameterName
          SALESFORCE_CLIENT_ID: !Ref SfConsumerKeyParam
          SALESFORCE_USERNAME: !Ref SfUsernameParam
          SALESFORCE_LOGIN_URL: !Ref SfLoginUrlParam
          SALESFORCE_JWT_KEY_PARAMETER: !Ref SalesforceJwtKeyParameterName
          SALESFORCE_API_VERSION: !Ref SalesforceApiVersion
          SALESFORCE_TOKEN_CACHE_MINUTES: !Ref SalesforceTokenCacheMinutes
          CONFIG_CACHE_SECONDS: !Ref ConfigCacheSeconds

  SlackApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: cloud-agentic-iot-slack-api
      ProtocolType: HTTP

  SlackApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref SlackApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SlackIntegrationFunction.Arn
      PayloadFormatVersion: '2.0'

  SlackApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SlackApi
      RouteKey: 'POST /slack/commands'
      Target: !Sub 'integrations/${SlackApiIntegration}'

  SlackApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref SlackApi
      StageName: '$default'
      AutoDeploy: true

  SlackApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SlackIntegrationFunction
      Principal: apigateway.amazonaws.com

Outputs:
  SlackCommandsUrl:
    Description: Set this as the Request URL for each Slack slash command in api.slack.com
    Value: !Sub 'https://${SlackApi}.execute-api.${AWS::Region}.amazonaws.com/slack/commands'
