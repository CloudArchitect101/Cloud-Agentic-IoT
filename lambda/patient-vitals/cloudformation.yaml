AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Cloud-Agentic-IoT telemetry ingestion: IoT rule -> telemetry queue -> patient-vitals
  (scores, archives to S3, keeps per-device state in DynamoDB) -> sync queue ->
  salesforce-sync (Patient_Vitals__c, 200 records per call); presence: AWS IoT
  connect and disconnect events -> presence queue -> device-presence (the Asset's
  connection fields, 200 boards per call); and command answers: device/<thing>/ack
  -> answer queue -> device-command-ack (each Device Command's Status, at most 10
  answers per call). Sized by config/<env>.json.

# Every number below comes from config/<env>.json: scripts/deploy-aws.sh
# passes the "patient-vitals" section as parameter overrides, and a test fails
# the checks if that file names a parameter this template does not declare.
# The defaults are for a first deploy into a small Dev account.
#
# Shaped for a million devices sending every 30 seconds, about 33,000 readings
# a second (docs/SCALING.md): IoT Core puts readings on a queue instead of
# invoking a function per reading, the function takes them in batches, and
# Salesforce sees only state changes, through a queue of its own that it
# drains at the concurrency the org can take.
Parameters:
  # Settings Salesforce owns, seeded into SSM from the environment's GitHub
  # secrets by the pipeline's seed step. Plain values, resolved at deploy time.
  SfConsumerKeyParam:
    Type: 'AWS::SSM::Parameter::Value<String>'
    Default: /cloud-agentic-iot/salesforce/consumer-key
  SfUsernameParam:
    Type: 'AWS::SSM::Parameter::Value<String>'
    Default: /cloud-agentic-iot/salesforce/username
  SfLoginUrlParam:
    Type: 'AWS::SSM::Parameter::Value<String>'
    Default: /cloud-agentic-iot/salesforce/login-url
  # Names, not values: the functions read these at runtime. The private key is
  # a SecureString, which CloudFormation cannot resolve into a template and
  # which must not sit in an environment variable anyway; the thresholds are
  # read at runtime so a change in SSM needs no deploy.
  SalesforceJwtKeyParameterName:
    Type: String
    Default: /cloud-agentic-iot/salesforce/jwt-private-key
    AllowedPattern: '^/.+'
  ThresholdsParameterName:
    Type: String
    Default: /cloud-agentic-iot/config/vital-thresholds
    AllowedPattern: '^/.+'
    Description: The clinical bands, seeded from config/vital-thresholds.json by scripts/deploy-aws.sh.

  PatientVitalsTableName:
    Type: String
    Default: patient-vitals
    Description: DynamoDB table name for patient vitals storage
  KeepReadingsInDynamoDB:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      Also write every reading to DynamoDB, for READING_RETENTION_DAYS. The S3
      archive always has them. At a million devices this is 33,000 writes a
      second, so Prod keeps it off.
  ReadingRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
  ArchiveRetentionDays:
    Type: Number
    Default: 365
    MinValue: 1
    Description: How long the S3 archive keeps readings. Set it from your records retention policy.

  # Data Cloud (docs/DATA-CLOUD.md). Its Amazon S3 connector reads CSV or
  # Parquet from one flat folder, not the archive's gzipped NDJSON in day and
  # hour folders, so with DataCloudExport on, each batch is also written as one
  # CSV file under datacloud/room-readings/. Data Cloud reads that folder in
  # one of two ways, and each is off until its parameters are set:
  #   - a role (DataCloudOidcProviderArn and DataCloudExternalId), for a
  #     regular account: Data Cloud signs in through the org's own identity
  #     provider and assumes DataCloudReaderRole. No key exists anywhere.
  #   - a user (DataCloudReaderUserName), for an AWS project with a spend
  #     limit, which cannot hold an identity provider: an IAM user made by
  #     hand, whose access key exists only in Data Cloud. This template never
  #     creates a user or a key; it only lets that user read datacloud/.
  # Either reads datacloud/ and nothing else: not readings/, and no writes.
  # The three names come from the environment, not config/<env>.json
  # (scripts/deploy-aws.sh: DATA_CLOUD_OIDC_PROVIDER_ARN,
  # DATA_CLOUD_EXTERNAL_ID, DATA_CLOUD_READER_USER), and a later deploy that
  # leaves them unset keeps what the stack has.
  DataCloudExport:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      'true' also writes each batch of readings as one CSV file under
      datacloud/room-readings/, the folder a Data Cloud Amazon S3 data stream reads.
  DataCloudExportRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    Description: >-
      How long the CSV files stay. They are only Data Cloud's pickup folder:
      what a data stream ingested stays in Data Cloud, and the archive keeps every reading.
  DataCloudOidcProviderArn:
    Type: String
    Default: ''
    AllowedPattern: '^(arn:aws[a-z-]*:iam::[0-9]{12}:oidc-provider/[^/]+/services/connectors)?$'
    Description: >-
      The IAM identity provider for the org's My Domain, https://<My Domain>/services/connectors,
      made once by hand (docs/DATA-CLOUD.md). With DataCloudExternalId, creates DataCloudReaderRole.
  DataCloudExternalId:
    Type: String
    Default: ''
    AllowedPattern: '^[A-Za-z0-9:_.-]*$'
    Description: The External ID Data Cloud shows for the Amazon S3 connection. The role trusts that connection only.
  DataCloudReaderUserName:
    Type: String
    Default: ''
    AllowedPattern: '^[A-Za-z0-9+=,.@_-]*$'
    Description: >-
      The IAM user, made by hand before this is set, whose access key Data Cloud holds.
      The bucket policy lets it read datacloud/ only. For an AWS project, which cannot use the role.
  RealertIntervalMinutes:
    Type: Number
    Default: 15
    MinValue: 1
    Description: >-
      While a patient stays AT_RISK or CRITICAL, how often Salesforce is
      reminded and, with RoomTempAlert on, how often a device that stays at or
      above RoomTempAlertCelsius is reported again.
  RoomTempAlert:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >-
      Demo rule, not clinical: when 'true', a temperature at or above
      RoomTempAlertCelsius is sent to Salesforce, flagged, on first crossing and
      then at most every RealertIntervalMinutes while it stays there. Salesforce
      opens one Case per episode from it. Deploy the Salesforce side first.
  RoomTempAlertCelsius:
    Type: Number
    Default: 30
    MinValue: 1
    Description: Threshold for RoomTempAlert, inclusive, in C.

  IngestBatchSize:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 10000
  IngestBatchWindowSeconds:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 300
    Description: Must be at least 1 when IngestBatchSize is over 10 (an SQS event source rule).
  IngestMaxConcurrency:
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 1000
  IngestMemoryMB:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240

  SyncBatchSize:
    Type: Number
    Default: 200
    MinValue: 1
    MaxValue: 10000
  SyncBatchWindowSeconds:
    Type: Number
    Default: 5
    MinValue: 0
    MaxValue: 300
  SyncMaxConcurrency:
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 1000
    Description: Parallel Salesforce writers. Each holds one API request open at a time.

  PresenceBatchSize:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 10000
    Description: Connect and disconnect events per device-presence invocation. Salesforce gets one call per 200 boards in it.
  PresenceBatchWindowSeconds:
    Type: Number
    Default: 5
    MinValue: 0
    MaxValue: 300
    Description: >-
      How long device-presence waits to fill a batch. With any window above 0, Lambda may hold a lone
      event up to 20 s on a quiet queue; 0 sends it at once. Must be at least 1 when PresenceBatchSize
      is over 10 (an SQS event source rule).

  QueueMaxReceiveCount:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Deliveries before a message moves to its dead-letter queue.
  QueueRetentionSeconds:
    Type: Number
    Default: 345600
    MinValue: 60
    MaxValue: 1209600
    Description: How long a reading waits in a queue when its consumer is down (default 4 days).
  IngestMaxAgeSeconds:
    Type: Number
    Default: 300
    MinValue: 60
    Description: Alarm when the oldest waiting reading is older than this - ingestion is falling behind.

  SalesforceApiVersion:
    Type: String
    Default: '64.0'
    AllowedPattern: '^\d+\.\d$'
  SalesforceTokenCacheMinutes:
    Type: Number
    Default: 30
    MinValue: 1
    Description: Keep under the integration user's session timeout in Salesforce.
  ConfigCacheSeconds:
    Type: Number
    Default: 300
    MinValue: 0
    Description: How long a function keeps an SSM value before reading it again.
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
  AlarmTopicArn:
    Type: String
    Default: ''
    Description: SNS topic for the alarms below. Empty, they show in CloudWatch only.

Conditions:
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, '']]
  DataCloudExportOn: !Equals [!Ref DataCloudExport, 'true']
  HasDataCloudRole: !And
    - !Not [!Equals [!Ref DataCloudOidcProviderArn, '']]
    - !Not [!Equals [!Ref DataCloudExternalId, '']]
  HasDataCloudReaderUser: !Not [!Equals [!Ref DataCloudReaderUserName, '']]

Resources:
  # ------------------------------------------------------------------ storage

  # One STATE item per device (PK PATIENT#<id>, SK STATE), and, with
  # KeepReadingsInDynamoDB, one item per reading (SK VITAL#<timestamp>) that
  # the TTL removes after ReadingRetentionDays. On demand, so it scales with
  # the fleet; docs/SCALING.md has the point at which provisioned capacity
  # becomes cheaper.
  PatientVitalsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref PatientVitalsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ExpiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # Every reading, gzipped NDJSON, one object per batch, partitioned
  # readings/date=YYYY-MM-DD/hour=HH/ for Athena. With DataCloudExport, the
  # same readings as CSV under datacloud/room-readings/, for Data Cloud. Kept
  # when the stack is deleted: it is clinical history.
  ArchiveBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'cloud-agentic-iot-readings-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-readings
            Status: Enabled
            Prefix: readings/
            ExpirationInDays: !Ref ArchiveRetentionDays
          - Id: expire-data-cloud-copy
            Status: Enabled
            Prefix: datacloud/
            ExpirationInDays: !Ref DataCloudExportRetentionDays

  ArchiveBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArchiveBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ArchiveBucket.Arn
              - !Sub '${ArchiveBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          # The Data Cloud reader user (DataCloudReaderUserName): list and
          # read datacloud/, nothing else. In the same account a bucket policy
          # alone is enough, so the user needs no policy of its own.
          - !If
            - HasDataCloudReaderUser
            - Sid: DataCloudReaderFindsTheBucket
              Effect: Allow
              Principal:
                AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:user/${DataCloudReaderUserName}'
              Action: s3:GetBucketLocation
              Resource: !GetAtt ArchiveBucket.Arn
            - !Ref AWS::NoValue
          - !If
            - HasDataCloudReaderUser
            - Sid: DataCloudReaderListsItsFolder
              Effect: Allow
              Principal:
                AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:user/${DataCloudReaderUserName}'
              Action: s3:ListBucket
              Resource: !GetAtt ArchiveBucket.Arn
              Condition:
                StringLike:
                  s3:prefix: 'datacloud/*'
            - !Ref AWS::NoValue
          - !If
            - HasDataCloudReaderUser
            - Sid: DataCloudReaderReadsItsFolder
              Effect: Allow
              Principal:
                AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:user/${DataCloudReaderUserName}'
              Action: s3:GetObject
              Resource: !Sub '${ArchiveBucket.Arn}/datacloud/*'
            - !Ref AWS::NoValue

  # What Data Cloud assumes to read datacloud/, in a regular account
  # (docs/DATA-CLOUD.md). Data Cloud signs in with a token from the org's own
  # identity provider, https://<My Domain>/services/connectors, whose audience
  # IAM checks against the provider's client ID list; the role then admits
  # only the one connection whose External ID is DataCloudExternalId. The
  # condition key holds the provider's host, which a YAML key cannot take from
  # a parameter, so the trust policy is written as JSON text.
  DataCloudReaderRole:
    Type: AWS::IAM::Role
    Condition: HasDataCloudRole
    Properties:
      RoleName: cloud-agentic-iot-data-cloud-reader
      Description: Data Cloud's Amazon S3 connection reads datacloud/ in the readings archive as this role. No access keys.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument: !Sub
        - |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": { "Federated": "${DataCloudOidcProviderArn}" },
                "Action": "sts:AssumeRoleWithWebIdentity",
                "Condition": { "StringEquals": { "${Issuer}:sub": "${DataCloudExternalId}" } }
              }
            ]
          }
        - Issuer: !Select [1, !Split [':oidc-provider/', !Ref DataCloudOidcProviderArn]]
      Policies:
        - PolicyName: ReadDataCloudFolder
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetBucketLocation
                Resource: !GetAtt ArchiveBucket.Arn
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ArchiveBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: 'datacloud/*'
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${ArchiveBucket.Arn}/datacloud/*'

  # ------------------------------------------------------------------ queues

  # Readings wait here between IoT Core and the function. A burst, a slow
  # deploy or a DynamoDB throttle backs up the queue instead of dropping
  # readings, and the function drains it in batches.
  TelemetryDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: cloud-agentic-iot-telemetry-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  TelemetryQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: cloud-agentic-iot-telemetry
      # At least six times the function's timeout (60 s), as AWS recommends
      # for an SQS event source, so a batch being retried is not handed to a
      # second invocation while the first still holds it.
      VisibilityTimeout: 360
      MessageRetentionPeriod: !Ref QueueRetentionSeconds
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt TelemetryDeadLetterQueue.Arn
        maxReceiveCount: !Ref QueueMaxReceiveCount

  # What Salesforce should hear: state changes and due re-alerts only.
  SyncDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: cloud-agentic-iot-salesforce-sync-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  SyncQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: cloud-agentic-iot-salesforce-sync
      VisibilityTimeout: 360   # six times salesforce-sync's 60 s timeout
      MessageRetentionPeriod: !Ref QueueRetentionSeconds
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SyncDeadLetterQueue.Arn
        maxReceiveCount: !Ref QueueMaxReceiveCount

  # ------------------------------------------------------------------ IoT rule

  # topic(2) is the Thing name in device/<thing>/telemetry. The device policy
  # lets a device publish only to its own topic, so unlike a deviceId in the
  # body it cannot name another patient. timestamp() is when IoT Core received
  # the message: identical on every retry, so the keys built from it are too.
  PatientVitalsIoTRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: cloud_agentic_iot_patient_vitals
      TopicRulePayload:
        Sql: "SELECT *, topic(2) AS thingName, timestamp() AS receivedAt FROM 'device/+/telemetry'"
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Actions:
          - Sqs:
              QueueUrl: !Ref TelemetryQueue
              RoleArn: !GetAtt IoTRuleRole.Arn
              UseBase64: false
        # A reading the rule cannot deliver is logged, not silently dropped.
        ErrorAction:
          CloudwatchLogs:
            LogGroupName: !Ref IoTRuleErrorLogGroup
            RoleArn: !GetAtt IoTRuleRole.Arn

  IoTRuleErrorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /cloud-agentic-iot/iot-rule-errors/patient-vitals
      RetentionInDays: !Ref LogRetentionDays

  IoTRuleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: iot.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      # Every rule here delivers through this role: readings for
      # patient-vitals, connect and disconnect events for device-presence
      # (DevicePresenceIoTRule), and command answers for device-command-ack
      # (DeviceCommandAckIoTRule).
      Policies:
        - PolicyName: DeliverReadings
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource:
                  - !GetAtt TelemetryQueue.Arn
                  - !GetAtt PresenceQueue.Arn
                  - !GetAtt CommandAckQueue.Arn
              # The three calls AWS IoT's CloudWatch Logs action is
              # documented to need, so a rule's error reaches its log group.
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                Resource:
                  - !GetAtt IoTRuleErrorLogGroup.Arn
                  - !GetAtt PresenceRuleErrorLogGroup.Arn
                  - !GetAtt CommandAckRuleErrorLogGroup.Arn

  # ------------------------------------------------------------------ ingest

  PatientVitalsLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: Ingest
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt PatientVitalsTable.Arn
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:GetQueueAttributes
                Resource: !GetAtt TelemetryQueue.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt SyncQueue.Arn
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub '${ArchiveBucket.Arn}/readings/*'
                  - !Sub '${ArchiveBucket.Arn}/datacloud/room-readings/*'
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ThresholdsParameterName}'

  PatientVitalsLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cloud-agentic-iot-patient-vitals
      Runtime: nodejs22.x
      Handler: index.handler
      Code:
        ZipFile: |
          exports.handler = async () => {
            throw new Error('Placeholder - the deploy pipeline replaces this with the real bundle');
          };
      Role: !GetAtt PatientVitalsLambdaRole.Arn
      # The queues' visibility timeout (360 s) is six times this.
      Timeout: 60
      MemorySize: !Ref IngestMemoryMB
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref PatientVitalsTable
          SYNC_QUEUE_URL: !Ref SyncQueue
          ARCHIVE_BUCKET: !Ref ArchiveBucket
          # Empty: no Data Cloud copy. A flat folder, as a data stream reads.
          DATA_CLOUD_EXPORT_PREFIX: !If [DataCloudExportOn, 'datacloud/room-readings/', '']
          THRESHOLDS_PARAMETER: !Ref ThresholdsParameterName
          REALERT_INTERVAL_MINUTES: !Ref RealertIntervalMinutes
          ROOM_TEMP_ALERT: !Ref RoomTempAlert
          ROOM_TEMP_ALERT_CELSIUS: !Ref RoomTempAlertCelsius
          KEEP_READINGS_IN_DYNAMODB: !Ref KeepReadingsInDynamoDB
          READING_RETENTION_DAYS: !Ref ReadingRetentionDays
          CONFIG_CACHE_SECONDS: !Ref ConfigCacheSeconds
      TracingConfig:
        Mode: Active

  IngestEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt TelemetryQueue.Arn
      FunctionName: !Ref PatientVitalsLambda
      BatchSize: !Ref IngestBatchSize
      MaximumBatchingWindowInSeconds: !Ref IngestBatchWindowSeconds
      # Only the readings that failed go back to the queue, not the batch.
      FunctionResponseTypes: [ReportBatchItemFailures]
      ScalingConfig:
        MaximumConcurrency: !Ref IngestMaxConcurrency

  # ------------------------------------------------------------------ Salesforce

  SalesforceSyncRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: Sync
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:GetQueueAttributes
                Resource: !GetAtt SyncQueue.Arn
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SalesforceJwtKeyParameterName}'
              # The key is a SecureString: SSM decrypts it with KMS on the
              # function's behalf, and only on SSM's behalf.
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  SalesforceSyncFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cloud-agentic-iot-salesforce-sync
      Runtime: nodejs22.x
      Handler: index.handler
      Code:
        ZipFile: |
          exports.handler = async () => {
            throw new Error('Placeholder - the deploy pipeline replaces this with the real bundle');
          };
      Role: !GetAtt SalesforceSyncRole.Arn
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          SALESFORCE_CLIENT_ID: !Ref SfConsumerKeyParam
          SALESFORCE_USERNAME: !Ref SfUsernameParam
          SALESFORCE_LOGIN_URL: !Ref SfLoginUrlParam
          SALESFORCE_JWT_KEY_PARAMETER: !Ref SalesforceJwtKeyParameterName
          SALESFORCE_API_VERSION: !Ref SalesforceApiVersion
          SALESFORCE_TOKEN_CACHE_MINUTES: !Ref SalesforceTokenCacheMinutes
          CONFIG_CACHE_SECONDS: !Ref ConfigCacheSeconds

  SyncEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt SyncQueue.Arn
      FunctionName: !Ref SalesforceSyncFunction
      BatchSize: !Ref SyncBatchSize
      MaximumBatchingWindowInSeconds: !Ref SyncBatchWindowSeconds
      FunctionResponseTypes: [ReportBatchItemFailures]
      ScalingConfig:
        MaximumConcurrency: !Ref SyncMaxConcurrency

  # ------------------------------------------------------------------ presence

  # Whether each board is connected now, on its Asset (Connection_Status__c,
  # Connection_Since__c, Last_Disconnect_Reason__c). AWS IoT publishes an
  # event on $aws/events/presence/connected/<client ID> or .../disconnected/
  # whenever a client connects or disconnects: on by default, nothing to
  # switch on, and nothing for a board to send. The events wait in a queue of
  # their own, and device-presence gives Salesforce one call per batch, however
  # many boards changed in it, so a fleet reconnecting at once backs up here
  # instead of in the org.
  PresenceDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: cloud-agentic-iot-device-presence-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  PresenceQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: cloud-agentic-iot-device-presence
      VisibilityTimeout: 360   # six times device-presence's 60 s timeout
      MessageRetentionPeriod: !Ref QueueRetentionSeconds
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PresenceDeadLetterQueue.Arn
        maxReceiveCount: !Ref QueueMaxReceiveCount

  # Only the five fields device-presence reads, so a client's IP address and
  # principal never reach the queue or device-presence's logs. A delivery
  # error is the exception: AWS IoT's error message carries the original
  # event, IP address and certificate ID included, into
  # PresenceRuleErrorLogGroup, kept for LogRetentionDays. A client ID
  # starting live- is a browser watching a board's live readings, not a
  # board. Lifecycle events can arrive out of order and twice; device-presence
  # and DeviceConnectionService allow for both.
  DevicePresenceIoTRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: cloud_agentic_iot_device_presence
      TopicRulePayload:
        Sql: "SELECT clientId, eventType, timestamp, disconnectReason, versionNumber FROM '$aws/events/presence/+/+' WHERE NOT startswith(clientId, 'live-')"
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Actions:
          - Sqs:
              QueueUrl: !Ref PresenceQueue
              RoleArn: !GetAtt IoTRuleRole.Arn
              UseBase64: false
        # As for readings: an event the rule cannot deliver is logged, not lost.
        ErrorAction:
          CloudwatchLogs:
            LogGroupName: !Ref PresenceRuleErrorLogGroup
            RoleArn: !GetAtt IoTRuleRole.Arn

  PresenceRuleErrorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /cloud-agentic-iot/iot-rule-errors/device-presence
      RetentionInDays: !Ref LogRetentionDays

  DevicePresenceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: Presence
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:GetQueueAttributes
                Resource: !GetAtt PresenceQueue.Arn
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SalesforceJwtKeyParameterName}'
              # As for salesforce-sync: SSM decrypts the key with KMS on the
              # function's behalf, and only on SSM's behalf.
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  DevicePresenceFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cloud-agentic-iot-device-presence
      Runtime: nodejs22.x
      Handler: index.handler
      Code:
        ZipFile: |
          exports.handler = async () => {
            throw new Error('Placeholder - the deploy pipeline replaces this with the real bundle');
          };
      Role: !GetAtt DevicePresenceRole.Arn
      # The presence queue's visibility timeout (360 s) is six times this.
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          SALESFORCE_CLIENT_ID: !Ref SfConsumerKeyParam
          SALESFORCE_USERNAME: !Ref SfUsernameParam
          SALESFORCE_LOGIN_URL: !Ref SfLoginUrlParam
          SALESFORCE_JWT_KEY_PARAMETER: !Ref SalesforceJwtKeyParameterName
          SALESFORCE_API_VERSION: !Ref SalesforceApiVersion
          SALESFORCE_TOKEN_CACHE_MINUTES: !Ref SalesforceTokenCacheMinutes
          CONFIG_CACHE_SECONDS: !Ref ConfigCacheSeconds
          # A board connects with its Thing name as its client ID, and its
          # Asset holds the ARN of that Thing: this, then the name.
          THING_ARN_PREFIX: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:thing/'
          # The invocable Apex class that sets the Asset's connection fields.
          DEVICE_CONNECTION_ACTION: DeviceConnectionService

  PresenceEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt PresenceQueue.Arn
      FunctionName: !Ref DevicePresenceFunction
      BatchSize: !Ref PresenceBatchSize
      MaximumBatchingWindowInSeconds: !Ref PresenceBatchWindowSeconds
      FunctionResponseTypes: [ReportBatchItemFailures]
      # The fewest Lambda allows for a queue, and each invocation makes one
      # call at a time: the org never has more than two of these open at once.
      ScalingConfig:
        MaximumConcurrency: 2

  # ------------------------------------------------------------------ command answers

  # What each board said about a command it was sent, on the Device Command
  # record: Status Acked, or Failed with why. A board on firmware 2.2.0 or
  # later answers a command that carries a commandId (DeviceCommandSendJob
  # sends the record's Id as one) on device/<thing>/ack, once per command.
  # The answers wait in a queue of their own, so an org that is down or out of
  # API calls delays them instead of losing them.
  CommandAckDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: cloud-agentic-iot-device-command-ack-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  CommandAckQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: cloud-agentic-iot-device-command-ack
      # Six times device-command-ack's 60 s timeout.
      VisibilityTimeout: 360
      MessageRetentionPeriod: !Ref QueueRetentionSeconds
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CommandAckDeadLetterQueue.Arn
        maxReceiveCount: !Ref QueueMaxReceiveCount

  # Only the fields device-command-ack reads. A board may publish only on its
  # own device/<thing>/ack (DevicePolicy, in the queue-relay stack), so
  # topic(2) is the board that answered, whatever its message says, and
  # timestamp() is when AWS IoT received the answer. The board's field is
  # outcome, not result: RESULT is a reserved word in some SQL dialects.
  DeviceCommandAckIoTRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: cloud_agentic_iot_device_command_ack
      TopicRulePayload:
        Sql: "SELECT commandId, operation, outcome, detail, topic(2) AS thingName, timestamp() AS answeredAtMillis FROM 'device/+/ack'"
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Actions:
          - Sqs:
              QueueUrl: !Ref CommandAckQueue
              RoleArn: !GetAtt IoTRuleRole.Arn
              UseBase64: false
        # As for readings: an answer the rule cannot deliver is logged, not lost.
        ErrorAction:
          CloudwatchLogs:
            LogGroupName: !Ref CommandAckRuleErrorLogGroup
            RoleArn: !GetAtt IoTRuleRole.Arn

  CommandAckRuleErrorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /cloud-agentic-iot/iot-rule-errors/device-command-ack
      RetentionInDays: !Ref LogRetentionDays

  DeviceCommandAckRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CommandAck
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:GetQueueAttributes
                Resource: !GetAtt CommandAckQueue.Arn
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SalesforceJwtKeyParameterName}'
              # As for salesforce-sync: SSM decrypts the key with KMS on the
              # function's behalf, and only on SSM's behalf.
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  DeviceCommandAckFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cloud-agentic-iot-device-command-ack
      Runtime: nodejs22.x
      Handler: index.handler
      Code:
        ZipFile: |
          exports.handler = async () => {
            throw new Error('Placeholder - the deploy pipeline replaces this with the real bundle');
          };
      Role: !GetAtt DeviceCommandAckRole.Arn
      # The answer queue's visibility timeout (360 s) is six times this.
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          SALESFORCE_CLIENT_ID: !Ref SfConsumerKeyParam
          SALESFORCE_USERNAME: !Ref SfUsernameParam
          SALESFORCE_LOGIN_URL: !Ref SfLoginUrlParam
          SALESFORCE_JWT_KEY_PARAMETER: !Ref SalesforceJwtKeyParameterName
          SALESFORCE_API_VERSION: !Ref SalesforceApiVersion
          SALESFORCE_TOKEN_CACHE_MINUTES: !Ref SalesforceTokenCacheMinutes
          CONFIG_CACHE_SECONDS: !Ref ConfigCacheSeconds
          # The invocable Apex class that records an answer on its Device Command.
          DEVICE_COMMAND_ACK_ACTION: DeviceCommandAckService

  # Fixed here, not sized by config/<env>.json: answers are few, one per
  # command, and each should show on its record within seconds. So there is
  # no batching window, which caps a batch at 10 messages, and Salesforce gets
  # one call per batch.
  CommandAckEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt CommandAckQueue.Arn
      FunctionName: !Ref DeviceCommandAckFunction
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 0
      FunctionResponseTypes: [ReportBatchItemFailures]
      # As for presence: the fewest Lambda allows for a queue, so the org never
      # has more than two of these calls open at once.
      ScalingConfig:
        MaximumConcurrency: 2

  # ------------------------------------------------------------------ alarms

  # A message in a dead-letter queue is a reading, a sync, a connection change
  # or a command answer that failed every retry. Someone should look at each
  # one.
  TelemetryDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: cloud-agentic-iot-telemetry-dead-letters
      AlarmDescription: Readings failed every retry. Inspect cloud-agentic-iot-telemetry-dlq, fix, then redrive.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt TelemetryDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  SyncDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: cloud-agentic-iot-salesforce-sync-dead-letters
      AlarmDescription: Salesforce refused records on every retry. Inspect cloud-agentic-iot-salesforce-sync-dlq and the salesforce-sync logs.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SyncDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  PresenceDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: cloud-agentic-iot-device-presence-dead-letters
      AlarmDescription: Salesforce did not take connection changes on any retry, so some Assets may show the wrong Connection. Inspect cloud-agentic-iot-device-presence-dlq and the device-presence logs.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt PresenceDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  CommandAckDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: cloud-agentic-iot-device-command-ack-dead-letters
      AlarmDescription: Salesforce did not take command answers on any retry, so some Device Commands may still show Sent although their board answered. Inspect cloud-agentic-iot-device-command-ack-dlq and the device-command-ack logs.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt CommandAckDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  # The first sign that the fleet outgrew IngestMaxConcurrency or a quota.
  IngestFallingBehindAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: cloud-agentic-iot-telemetry-falling-behind
      AlarmDescription: Readings are waiting longer than IngestMaxAgeSeconds. Raise IngestMaxConcurrency or IngestBatchSize in config/<env>.json, or look for throttling.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt TelemetryQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 5
      Threshold: !Ref IngestMaxAgeSeconds
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

Outputs:
  PatientVitalsTableArn:
    Description: DynamoDB table ARN
    Value: !GetAtt PatientVitalsTable.Arn
  PatientVitalsLambdaArn:
    Description: Lambda function ARN
    Value: !GetAtt PatientVitalsLambda.Arn
  PatientVitalsLambdaFunctionName:
    Description: Lambda function name
    Value: !Ref PatientVitalsLambda
  TelemetryQueueUrl:
    Value: !Ref TelemetryQueue
  SyncQueueUrl:
    Value: !Ref SyncQueue
  PresenceQueueUrl:
    Value: !Ref PresenceQueue
  CommandAckQueueUrl:
    Value: !Ref CommandAckQueue
  ArchiveBucketName:
    Description: Every reading, for Athena, and the bucket a Data Cloud Amazon S3 connection names
    Value: !Ref ArchiveBucket
  DataCloudFolder:
    Description: The folder of CSV files a Data Cloud data stream imports, when DataCloudExport is on
    Value: !If [DataCloudExportOn, 'datacloud/room-readings/', 'off: set DataCloudExport to true']
  DataCloudReaderRoleArn:
    Condition: HasDataCloudRole
    Description: The IAM Role Name (an ARN) for the Data Cloud Amazon S3 connection
    Value: !GetAtt DataCloudReaderRole.Arn
