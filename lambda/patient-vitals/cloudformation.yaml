AWSTemplateFormatVersion: '2010-09-09'
Description: Cloud-Agentic-IoT Branch 01 - Data Cloud RAG Pipeline (Lambda + DynamoDB)

# SalesforceInstance/ClientId/Username were referenced without being declared,
# which failed validation outright. SalesforceClientSecret and SalesforcePassword
# are gone entirely: lambda/patient-vitals/index.js authenticates with the JWT
# bearer flow and never reads them - they were left over from a password-flow
# version of this template and contradicted the rest of the repo.
Parameters:
  # SSM-backed, matching lambda/slack-integration. The values are seeded from
  # GitHub Environment secrets by deploy-aws.yml, so GitHub stays the single
  # source of truth and SSM is only the delivery path the templates read.
  SfInstanceParam:
    Type: 'AWS::SSM::Parameter::Value<String>'
    Default: /cloud-agentic-iot/salesforce/instance
  SfConsumerKeyParam:
    Type: 'AWS::SSM::Parameter::Value<String>'
    Default: /cloud-agentic-iot/salesforce/consumer-key
  SfUsernameParam:
    Type: 'AWS::SSM::Parameter::Value<String>'
    Default: /cloud-agentic-iot/salesforce/username
  SfLoginUrlParam:
    Type: 'AWS::SSM::Parameter::Value<String>'
    Default: /cloud-agentic-iot/salesforce/login-url
  SfJwtPrivateKeyParam:
    Type: 'AWS::SSM::Parameter::Value<String>'
    Default: /cloud-agentic-iot/salesforce/jwt-private-key
  PatientVitalsTableName:
    Type: String
    Default: patient-vitals
    Description: DynamoDB table name for patient vitals storage

Resources:
  # DynamoDB Table for patient vitals time-series storage
  PatientVitalsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref PatientVitalsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ExpiresAt
        Enabled: true

  # Lambda Execution Role
  PatientVitalsLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource: !GetAtt PatientVitalsTable.Arn
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  # Lambda Function for patient vital processing
  PatientVitalsLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cloud-agentic-iot-patient-vitals
      Runtime: nodejs20.x
      Handler: index.handler
      Code:
        ZipFile: |
          # See index.js for full implementation
      Role: !GetAtt PatientVitalsLambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref PatientVitalsTableName
          SALESFORCE_ENDPOINT: !Sub 'https://${SfInstanceParam}.salesforce.com'
          SALESFORCE_CLIENT_ID: !Ref SfConsumerKeyParam
          SALESFORCE_USERNAME: !Ref SfUsernameParam
          SALESFORCE_LOGIN_URL: !Ref SfLoginUrlParam
          SALESFORCE_JWT_PRIVATE_KEY: !Ref SfJwtPrivateKeyParam
      TracingConfig:
        Mode: Active

  # IoT Rule to trigger Lambda on telemetry events
  #
  # The previous version of this resource nested TopicRulePayload inside itself,
  # carried a "Payload" property that does not exist on AWS::IoT::TopicRule, and
  # gave the Lambda action RoleArn/Endpoint instead of FunctionArn. That is what
  # CloudFormation rejected as AWS::EarlyValidation::PropertyValidation - a
  # message that names no property, so the shape had to be read against the
  # resource schema.
  PatientVitalsIoTRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: cloud_agentic_iot_patient_vitals
      TopicRulePayload:
        Sql: "SELECT * FROM 'device/+/telemetry'"
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Actions:
          - Lambda:
              FunctionArn: !GetAtt PatientVitalsLambda.Arn

  # Without this, the rule exists but IoT Core is not allowed to invoke the
  # function, and telemetry silently goes nowhere.
  PatientVitalsIoTInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PatientVitalsLambda.Arn
      Principal: iot.amazonaws.com
      SourceArn: !GetAtt PatientVitalsIoTRule.Arn

Outputs:
  PatientVitalsTableArn:
    Description: DynamoDB table ARN
    Value: !GetAtt PatientVitalsTable.Arn

  PatientVitalsLambdaArn:
    Description: Lambda function ARN
    Value: !GetAtt PatientVitalsLambda.Arn

  PatientVitalsLambdaFunctionName:
    Description: Lambda function name
    Value: !Ref PatientVitalsLambda
