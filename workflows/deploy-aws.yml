name: Deploy AWS Infrastructure

on:
  push:
    branches: [Dev, Prod]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS credentials (OIDC, no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Validate every CloudFormation template before deploying anything
        run: |
          set -euo pipefail
          for stack in $(find . -name cloudformation.yaml -not -path "./node_modules/*"); do
            echo "Validating $stack"
            aws cloudformation validate-template --template-body "file://$stack" > /dev/null
          done

      - name: Deploy stacks
        run: |
          set -euo pipefail
          for stack in $(find . -name cloudformation.yaml -not -path "./node_modules/*"); do
            dir=$(dirname "$stack")
            name=$(basename "$dir")
            echo "::group::Deploying $stack"
            aws cloudformation deploy \
              --template-file "$stack" \
              --stack-name "cloud-agentic-iot-$name-${{ github.ref_name }}" \
              --capabilities CAPABILITY_NAMED_IAM \
              --no-fail-on-empty-changeset
            echo "::endgroup::"
          done

      # The templates carry a placeholder inline handler so the stack can be
      # created standalone. Real source lives next to it in git, so every
      # directory holding an index.js is bundled and pushed over the top here —
      # without this step the stacks deploy green while running placeholder code.
      - name: Package and upload real Lambda source
        run: |
          set -euo pipefail
          for src in $(find . -name index.js -not -path "./node_modules/*" -not -path "*/node_modules/*"); do
            dir=$(dirname "$src")
            fn="cloud-agentic-iot-$(basename "$dir")"

            if ! aws lambda get-function --function-name "$fn" > /dev/null 2>&1; then
              echo "::error::No Lambda named $fn for source in $dir. FunctionName in the \
          CloudFormation template must match cloud-agentic-iot-<source directory name>."
              exit 1
            fi

            echo "::group::Packaging $dir -> $fn"
            pushd "$dir" > /dev/null
            if [ -f package.json ]; then
              npm install --omit=dev --no-audit --no-fund
            fi
            zip -qr /tmp/"$fn".zip .
            popd > /dev/null

            aws lambda update-function-code \
              --function-name "$fn" \
              --zip-file fileb:///tmp/"$fn".zip \
              --publish > /dev/null
            echo "::endgroup::"
          done
